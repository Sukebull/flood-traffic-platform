# 自己可以改端口号
server:
  port: 9999
## 数据库配置（通过环境变量覆盖，示例见 application.yml.example）
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flood_traffic_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

# P1-3: Python 仿真引擎地址与项目目录统一配置（原先硬编码散落 Controller/Service）
python:
  base-url: ${PYTHON_BASE_URL:http://localhost:8000}
  project-dir: ${PYTHON_PROJECT_DIR:}

# MyBatis-Plus 的专属配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名自动映射
    # 调试用：在控制台打印生成的 SQL，生产可关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl